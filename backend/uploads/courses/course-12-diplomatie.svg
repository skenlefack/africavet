<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b4332;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#354e84;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a472a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7ac142;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#354e84;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <!-- Africa continent silhouette (simplified) -->
  <path d="M380,50 C360,55 345,70 340,90 C335,110 330,130 335,150 C340,170 330,185 325,200 C320,215 315,235 325,255 C335,275 330,295 340,310 C350,325 360,340 365,355 C370,370 380,380 395,375 C410,370 415,355 425,345 C435,335 445,320 450,300 C455,280 460,260 455,240 C450,220 460,200 465,180 C470,160 465,140 455,125 C445,110 440,95 430,80 C420,65 410,55 395,50 Z" fill="rgba(122,193,66,0.12)" stroke="rgba(122,193,66,0.25)" stroke-width="1.5"/>
  <!-- Connection dots on Africa -->
  <circle cx="370" cy="120" r="5" fill="#7ac142" opacity="0.8"/>
  <circle cx="395" cy="180" r="5" fill="#5dade2" opacity="0.8"/>
  <circle cx="355" cy="220" r="5" fill="#f39c12" opacity="0.8"/>
  <circle cx="420" cy="280" r="5" fill="#e74c3c" opacity="0.8"/>
  <circle cx="380" cy="310" r="5" fill="#9b59b6" opacity="0.8"/>
  <!-- Connection lines -->
  <line x1="370" y1="120" x2="395" y2="180" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="395" y1="180" x2="355" y2="220" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="355" y1="220" x2="420" y2="280" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="420" y1="280" x2="380" y2="310" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="370" y1="120" x2="420" y2="280" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Decorative circles -->
  <circle cx="680" cy="80" r="150" fill="rgba(255,255,255,0.02)"/>
  <circle cx="100" cy="380" r="120" fill="rgba(255,255,255,0.02)"/>
  <!-- Handshake / diplomacy icon -->
  <g transform="translate(570, 100)">
    <circle cx="50" cy="50" r="45" fill="rgba(122,193,66,0.15)" stroke="rgba(122,193,66,0.4)" stroke-width="2"/>
    <text x="50" y="60" text-anchor="middle" font-size="36">&#x1F91D;</text>
  </g>
  <!-- Globe icon -->
  <g transform="translate(570, 220)">
    <circle cx="50" cy="50" r="45" fill="rgba(93,173,226,0.15)" stroke="rgba(93,173,226,0.4)" stroke-width="2"/>
    <text x="50" y="60" text-anchor="middle" font-size="36">&#x1F30D;</text>
  </g>
  <!-- Title -->
  <text x="400" y="380" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="bold" fill="white">Diplomatie One Health</text>
  <text x="400" y="415" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="rgba(255,255,255,0.8)">en contexte africain</text>
  <!-- Badge -->
  <rect x="260" y="425" width="280" height="28" rx="14" fill="url(#gold)"/>
  <text x="400" y="445" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="white">AVANCÉ  |  30h  |  6 MODULES  |  CERTIFIANT</text>
  <!-- AfricaVET logo text -->
  <text x="40" y="35" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="rgba(255,255,255,0.8)">AfricaVET</text>
  <rect x="40" y="42" width="80" height="3" rx="1.5" fill="url(#accent2)"/>
  <!-- E-Learning badge -->
  <rect x="640" y="15" width="140" height="30" rx="15" fill="rgba(255,255,255,0.15)"/>
  <text x="710" y="36" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="rgba(255,255,255,0.9)">E-LEARNING</text>
</svg>
