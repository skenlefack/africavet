<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5276;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2e86c1;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7ac142;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5dade2;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <!-- Pattern overlay -->
  <circle cx="650" cy="100" r="180" fill="rgba(255,255,255,0.03)"/>
  <circle cx="700" cy="350" r="120" fill="rgba(255,255,255,0.04)"/>
  <circle cx="150" cy="400" r="100" fill="rgba(255,255,255,0.02)"/>
  <!-- Icon: interconnected circles (One Health symbol) -->
  <circle cx="400" cy="155" r="50" fill="none" stroke="rgba(122,193,66,0.6)" stroke-width="3"/>
  <circle cx="355" cy="215" r="50" fill="none" stroke="rgba(93,173,226,0.6)" stroke-width="3"/>
  <circle cx="445" cy="215" r="50" fill="none" stroke="rgba(243,156,18,0.6)" stroke-width="3"/>
  <!-- Center dot -->
  <circle cx="400" cy="190" r="8" fill="rgba(255,255,255,0.8)"/>
  <!-- Icons inside circles -->
  <text x="400" y="145" text-anchor="middle" font-size="28" fill="rgba(255,255,255,0.9)">&#x1F3E5;</text>
  <text x="352" y="225" text-anchor="middle" font-size="24" fill="rgba(255,255,255,0.9)">&#x1F404;</text>
  <text x="448" y="225" text-anchor="middle" font-size="24" fill="rgba(255,255,255,0.9)">&#x1F333;</text>
  <!-- Title -->
  <text x="400" y="310" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="bold" fill="white">One Health : Comprendre</text>
  <text x="400" y="345" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="bold" fill="white">l'approche intégrée</text>
  <!-- Badge -->
  <rect x="310" y="365" width="180" height="32" rx="16" fill="url(#accent1)"/>
  <text x="400" y="387" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="white">DÉBUTANT  |  2h</text>
  <!-- AfricaVET logo text -->
  <text x="40" y="35" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="rgba(255,255,255,0.8)">AfricaVET</text>
  <rect x="40" y="42" width="80" height="3" rx="1.5" fill="url(#accent1)"/>
  <!-- E-Learning badge -->
  <rect x="640" y="15" width="140" height="30" rx="15" fill="rgba(255,255,255,0.15)"/>
  <text x="710" y="36" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="rgba(255,255,255,0.9)">E-LEARNING</text>
</svg>
