name: AfricaVET CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # CI: test & build
  # ──────────────────────────────────────────────
  ci:
    name: CI — Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── Backend ──
      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-deps-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: backend-deps-

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-key-that-is-at-least-32-characters-long
          NODE_ENV: test
        run: npm test

      # ── Admin panel ──
      - name: Cache admin-next node_modules
        uses: actions/cache@v4
        with:
          path: admin-next/node_modules
          key: admin-deps-${{ hashFiles('admin-next/package-lock.json') }}
          restore-keys: admin-deps-

      - name: Install admin-next dependencies
        working-directory: admin-next
        run: npm ci --legacy-peer-deps

      - name: Build admin-next
        working-directory: admin-next
        env:
          CI: false
        run: npm run build

      # ── Frontend public site ──
      - name: Cache frontend-site-web node_modules
        uses: actions/cache@v4
        with:
          path: frontend-site-web/node_modules
          key: frontend-deps-${{ hashFiles('frontend-site-web/package-lock.json') }}
          restore-keys: frontend-deps-

      - name: Install frontend-site-web dependencies
        working-directory: frontend-site-web
        run: npm ci

      - name: Build frontend-site-web
        working-directory: frontend-site-web
        run: npm run build

  # ──────────────────────────────────────────────
  # Deploy: build Docker images & push to server
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -t africavet-backend:latest  ./backend
          docker build -t africavet-admin:latest     ./admin-next
          docker build -t africavet-frontend:latest  ./frontend-site-web

      - name: Save & compress Docker images
        run: |
          docker save africavet-backend:latest  | gzip > africavet-backend.tar.gz
          docker save africavet-admin:latest    | gzip > africavet-admin.tar.gz
          docker save africavet-frontend:latest | gzip > africavet-frontend.tar.gz

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: SCP images to server
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            africavet-backend.tar.gz \
            africavet-admin.tar.gz \
            africavet-frontend.tar.gz \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'DEPLOY'
          set -e

          echo "==> Loading Docker images..."
          sudo docker load < /tmp/africavet-backend.tar.gz
          sudo docker load < /tmp/africavet-admin.tar.gz
          sudo docker load < /tmp/africavet-frontend.tar.gz

          echo "==> Restarting services..."
          cd /home/ubuntu/africavet/deploy
          sudo docker compose \
            -f docker-compose.prod.yml \
            --env-file /home/ubuntu/africavet/.env \
            up -d

          echo "==> Cleaning up tar files..."
          rm -f /tmp/africavet-backend.tar.gz \
                /tmp/africavet-admin.tar.gz \
                /tmp/africavet-frontend.tar.gz

          echo "==> Deploy complete!"
          sudo docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          DEPLOY

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
